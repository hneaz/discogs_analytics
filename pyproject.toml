[project]
name = "discogs-analytics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dash>=4.4.1",
    "dash-bootstrap-components>=2.0.4",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=2.0,<3.0",
    "pandas-profiling>=3.2.0",
    "plotly>=7.0.0",
    "python-dotenv>=1.2.3",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]
